[package]
name = "japan-geoid-py"
version = "0.6.0"
edition.workspace = true
categories.workspace = true
description.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "japan_geoid"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.27.2"
numpy = "0.27.1"
japan-geoid = { path = "../", features = ["gsigeo2011", "jpgeo2024", "hrefconv2024", "jpgeo2024_hrefconv2024"] }
