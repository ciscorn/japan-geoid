# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = ["./japan-geoid-*"]

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = [
    "Taku Fukada <naninunenor@gmail.com>",
]
description = "Calculates geoid heights for Japan using GSI's geoid model."
license = "MIT"
repository = "https://github.com/ciscorn/japan-geoid"
categories = ["science", "science::geo"]

[package]
name = "japan-geoid"
version.workspace = true
edition.workspace = true
categories.workspace = true
authors.workspace = true
description.workspace = true
license = "MIT"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
gsigeo2011 = []
jpgeo2024 = []
hrefconv2024 = []
jpgeo2024_hrefconv2024 = []

[dependencies]
lz4_flex = { version = "0.12.0", default-features = false }

[[example]]
name = "use_embedded_gsigeo2011"
required-features = ["gsigeo2011"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.56"

[profile.dev.package."*"]
opt-level = 1
